services:
  flux-bot:
    build: .
    image: flux-bot:latest
    container_name: flux-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 默认只绑定宿主机回环：同机反向代理 / 本机浏览器可用，局域网不可直连。
      # 需要跨机反代或局域网直连时再显式设置 FLUX_BIND_ADDR=0.0.0.0（此时必须配 FLUX_AUTH_TOKEN）。
      - "${FLUX_BIND_ADDR:-127.0.0.1}:8600:8600"
    volumes:
      # Bot 定义、例程、任务记录、记忆、Claude Code 会话全部在这一个卷里
      - ./data:/data
    # 单机常驻服务：给 Bot 跑任务留出足够文件句柄
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
