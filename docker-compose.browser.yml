# 可选 overlay：给 Flux 加一个 Playwright MCP 浏览器 sidecar。
#
# 用法（必须同时叠加基础编排，否则 flux-bot 的镜像、卷与环境变量都会丢）：
#   docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d
#
# 设计取舍：browser 网络刻意 **不设 internal: true**。浏览器本来就要出站访问互联网，
# 一旦把网络设成 internal，sidecar 连不上任何站点，浏览器能力等于没有。需要收紧
# 出站时请由运维在宿主机 / 网关上做 egress 过滤（见 docs/browser-agent.md）。
#
# 2026-11-12 快照：npm @playwright/mcp 0.0.85（2026-11-09 发布）；官方镜像
# mcr.microsoft.com/playwright/mcp 存在 tag v0.0.85。下面的 sha256 是该 tag 的
# 多架构索引 digest，用 digest 钉死可避免 tag 被重新指向后悄悄换掉运行内容。
# 来源：npm registry、mcr.microsoft.com tag list、github.com/microsoft/playwright-mcp。
#
# 2026-11-13 实机验证（Docker 29 + 上面的钉死镜像）修掉两个启动即坏的问题：
#   1) --allowed-hosts 只写服务名会被 403 拒绝（客户端发的 Host 带端口）；
#   2) 输出目录挂到镜像里不存在的 /data/output 会因 root:root 属主 EACCES。
# 细节见下方各参数旁的注释与 docs/browser-agent.md 的「两个已知坑」。
#
# 2026-11-14：默认改为持久化 profile。--user-data-dir 落在 playwright-home 卷的
# /home/node/profiles/<profile id>，浏览器进程重启与容器重建后登录态仍在；
# 不再使用 --isolated。profile id 由 FLUX_BROWSER_PROFILE_ID 配置（默认 default），
# 重置方式见 docs/browser-agent.md 与 scripts/reset-browser-profile.sh。

services:
  flux-bot:
    networks:
      # 保留默认网络：8600 的宿主机端口发布不受影响
      - default
      # 与浏览器 sidecar 的专用网络，只有这两个容器加入
      - browser
    environment:
      # 一行的 JSON 对象，形状同 Claude Code 的 mcpServers；只允许 http / sse 远程 server。
      # 解析与校验见 server/flux/core/agent_runtime/extra_mcp.py。
      FLUX_CLAUDE_EXTRA_MCP_SERVERS: '{"browser":{"type":"http","url":"http://playwright-mcp:8931/mcp"}}'

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.85@sha256:cc70a6922ff856f3aba0fe97d0d94220dc9a7f367f6d332facc6d81d9a91e60e
    # 官方镜像默认入口不是长驻 HTTP 服务，这里按官方 README 的示例显式覆盖。
    entrypoint: ["node"]
    command:
      - "/app/cli.js"
      - "--headless"
      - "--browser"
      - "chromium"
      - "--no-sandbox"
      # profile 持久化到命名卷上的目录：浏览器进程重启（包括 MCP 空闲超时后
      # 重新拉起）、容器 stop/start、compose down/up 之后登录态都还在。
      # 不要同时使用 --isolated：它与 --user-data-dir 互斥，且会把 profile 只放内存。
      # 目录按 profile id 分层，默认 default；多用户部署时把
      # FLUX_BROWSER_PROFILE_ID 设为账号 / 用户 id，各人使用各自的子目录。
      # 这里的 ${...} 由 docker compose 插值（shell 环境或项目根的 .env），
      # 想写真正的字面量美元符要用 $$。
      - "--user-data-dir"
      - "/home/node/profiles/${FLUX_BROWSER_PROFILE_ID:-default}"
      - "--port"
      - "8931"
      - "--host"
      - "0.0.0.0"
      # Host 头白名单：默认只接受 localhost / 回环与 --host 的值。只写服务名
      # "playwright-mcp" 不够：HTTP 客户端（Claude Code、httpx）访问
      # http://playwright-mcp:8931/mcp 时发的是 "Host: playwright-mcp:8931"，
      # server 会直接回 403 "Access is only allowed at playwright-mcp"。
      # 因此必须把带端口的 host:port 形式一并列入（逗号分隔，同一个参数）。
      # 端口必须与上面的 --port 以及 flux-bot 里的 MCP url 保持一致。
      - "--allowed-hosts"
      - "playwright-mcp,playwright-mcp:8931"
      # 输出目录必须落在下面挂载的 /home/node 之下。不要用 /data/output：
      # 该路径在镜像里不存在，Docker 会为命名卷新建 root:root 755 的目录，
      # 而容器以 node(1000) 运行，browser_navigate 会 EACCES 写不进去。
      - "--output-dir"
      - "/home/node/output"
    # 不发布端口：只有 browser 网络里的 flux-bot 能连到 8931。
    expose:
      - "8931"
    init: true
    # Chromium 渲染 / 下载大页面需要足够的共享内存，默认 64MB 容易崩。
    shm_size: "1gb"
    restart: unless-stopped
    volumes:
      # 挂到 /home/node：该目录在镜像里已存在且属于 node，空命名卷首次挂载时
      # 会继承其属主，因此 node 能直接往里写。若挂到镜像里不存在的路径
      # （例如 /data/output），Docker 会以 root:root 创建挂载点，node 写不进去。
      # 截图与下载产物落到 /home/node/output；持久化 profile 落在
      # /home/node/profiles/<profile id>。二者共用同一个 node 可写的 home 卷，
      # 重置 profile 时只删 profiles/<id> 子目录，不会连带删掉 output。
      - playwright-home:/home/node
    networks:
      - browser

networks:
  browser:
    # 专用桥接网络：只有 flux-bot 与 playwright-mcp 加入，且不向宿主机发布端口。
    # 不设 internal: true，因为浏览器必须能访问互联网。
    driver: bridge

volumes:
  playwright-home:
